<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login | FaceMark</title>
    <link rel="stylesheet" href="../design/style.css">
</head>
<body class="auth-page">
    <div class="login-card">
        <h2>Admin Login</h2>
        <form>
            <div class="input-group"><label>Email</label><input type="email" id="adminEmail" required></div>
            <div class="input-group"><label>Password</label><input type="password" id="adminPass" required></div>
            <button type="button" onclick="handleAdminLogin()" class="btn-primary">Login as Admin</button>
        </form>
        <div class="footer-links"><a href="register.html">New Admin? Register</a></div>
        <div class="footer-links"><a href="../index.html">Home Page</a></div>
        
    </div>
    <script src="../javascript/auth.js"></script>
</body>
</html>
