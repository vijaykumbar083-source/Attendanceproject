<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Faculty Login | FaceMark</title>
    <link rel="stylesheet" href="../design/style.css">
</head>
<body class="auth-page">
    <div class="login-card">
        <h2>Faculty Login</h2>
        <form>
            <div class="input-group"><label>Email or Username</label><input type="text" id="userName" required></div>
            <div class="input-group"><label>Password</label><input type="password" id="userPass" required></div>
            <button type="button" onclick="handleUserLogin()" class="btn-primary">Sign In</button>
        </form>
        <div class="footer-links"><a href="adminlogin.html">Go to Admin Login</a></div>
        <div class="footer-links"><a href="../index.html">Home Page</a></div>
    </div>
    <script src="../javascript/auth.js"></script>
</body>
</html>
